<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Học từ vựng tiếng Trung (Offline)</title>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
      max-width: 600px;
      margin: auto;
      background-color: white;
      color: black;
    }
    input, select, button {
      font-size: 16px;
      margin-top: 5px;
    }
    button { margin-right: 5px; }
    #result.wrong { background:#f8d7da; padding:10px; border-radius:5px; }
    #result.correct { background:#d4edda; padding:10px; border-radius:5px; }
    .dark-mode { background:#1e1e1e; color:#f0f0f0; }
    .dark-mode input,
    .dark-mode select,
    .dark-mode button {
      background:#2e2e2e;
      color:white;
      border:1px solid #555;
    }
  </style>
</head>

<body>

<h2>Flashcard tiếng Trung (Offline)</h2>

<label>Chế độ học: </label>
<select id="mode">
  <option value="cn_to_vi">Tiếng Trung → Nghĩa</option>
  <option value="vi_to_cn">Nghĩa → Tiếng Trung</option>
</select>

<label><input id="showPinyin" type="checkbox" checked/> Hiện Pinyin</label>
<label><input type="checkbox" id="darkToggle"/> 🌙 Chế độ tối</label>

<div id="word" style="font-size:24px;margin:10px 0;"></div>

<input id="answer" placeholder="Nhập câu trả lời..." style="width:100%;" />

<button onclick="checkAnswer()">🔍 Kiểm tra</button>
<button onclick="nextWord()">➡️ Tiếp</button>
<button onclick="speak()">🔊 Đọc</button>
<button id="toggleModeBtn" onclick="toggleLearningMode()">📚 Học từ (Tất cả)</button><br/>

<button onclick="resetStats()">♻️ Reset</button>
<button onclick="exportWrongWords()">📥 Xuất từ sai</button>
<button onclick="openEdit()">✏️ Sửa từ</button>
<button onclick="exportEditedWords()">📤 Xuất từ đã sửa</button>
<button onclick="openAdd()">➕ Thêm từ mới</button>

<div id="result"></div>

<div id="stats">
  <h3>Thống kê</h3>
  <p id="total"></p>
  <p id="correct"></p>
  <p id="wrong"></p>
  <p id="accuracy"></p>
  <div id="wrong-list"></div>
</div>

<!-- MODAL SỬA -->
<div id="editModal" style="display:none;position:fixed;top:10%;left:50%;transform:translateX(-50%);background:#fff;padding:20px;border:1px solid #ccc;">
<h3>Sửa từ</h3>
Chinese <input id="editChinese"><br>
Pinyin <input id="editPinyin"><br>
Meaning <input id="editMeaning"><br>
<button onclick="saveEdit()">Lưu</button>
<button onclick="closeEdit()">Hủy</button>
</div>

<!-- MODAL THÊM -->
<div id="addModal" style="display:none;position:fixed;top:10%;left:50%;transform:translateX(-50%);background:#fff;padding:20px;border:1px solid #ccc;">
<h3>Thêm từ mới</h3>
Chinese <input id="addChinese"><br>
Pinyin <input id="addPinyin"><br>
Meaning <input id="addMeaning"><br>
<button onclick="saveNewWord()">Lưu</button>
<button onclick="closeAdd()">Hủy</button>
</div>

<script>
let vocabList=[];
let current={};
let stats={total:0,correct:0,wrong:0,wrongWords:[]};
let retryMode=false,retryList=[],retryIndex=0,recentWords=[],editedWords=[];
let addedWords = JSON.parse(localStorage.getItem("addedWords")) || [];

fetch('tuvung.json').then(r=>r.json()).then(data=>{
  vocabList = data.concat(addedWords);
  loadStats();
  nextWord();
});

function normalizeVN(str){
  return str.trim().toLowerCase();
}

function nextWord(){
  result.textContent="";
  answer.value="";
  if(retryMode && stats.wrongWords.length){
    current = stats.wrongWords[retryIndex++ % stats.wrongWords.length];
  }else{
    current = vocabList[Math.floor(Math.random()*vocabList.length)];
  }
  updateWordDisplay();
  answer.focus();
}

function updateWordDisplay(){
  if(mode.value==="cn_to_vi"){
    word.textContent=current.Chinese+(showPinyin.checked?" ("+current.Pinyin+")":"");
  }else{
    word.textContent=current.Meaning;
  }
}

function checkAnswer(){
  const input=normalizeVN(answer.value);
  const correct = mode.value==="cn_to_vi"?current.Meaning:current.Chinese;
  const list = correct.split(",").map(normalizeVN);

  stats.total++;

  if(list.includes(input)){
    stats.correct++;
    result.className="correct";
    result.textContent="✅ Chính xác!";
    setTimeout(nextWord,1200);
  }else{
    stats.wrong++;
    result.className="wrong";
    result.innerHTML=`❌ Sai<br>${current.Chinese} (${current.Pinyin}) - ${current.Meaning}`;
    if(!stats.wrongWords.some(w=>w.Chinese===current.Chinese)){
      stats.wrongWords.push(current);
    }
  }
  updateStats();
  saveStats();
}

function speak(){
  let u=new SpeechSynthesisUtterance(current.Chinese);
  u.lang="zh-CN";
  speechSynthesis.speak(u);
}

/* ==== THÊM TỪ ==== */

function openAdd(){
 addModal.style.display="block";
 addChinese.value="";
 addPinyin.value="";
 addMeaning.value="";
}
function closeAdd(){ addModal.style.display="none"; }

function saveNewWord(){
 let w={
  Chinese:addChinese.value.trim(),
  Pinyin:addPinyin.value.trim(),
  Meaning:addMeaning.value.trim()
 };
 if(!w.Chinese||!w.Pinyin||!w.Meaning){
  alert("Nhập đủ thông tin!");
  return;
 }
 vocabList.push(w);
 addedWords.push(w);
 localStorage.setItem("addedWords",JSON.stringify(addedWords));
 closeAdd();
 alert("Đã thêm từ mới!");
}

/* ==== SỬA ==== */

function openEdit(){
 editModal.style.display="block";
 editChinese.value=current.Chinese;
 editPinyin.value=current.Pinyin;
 editMeaning.value=current.Meaning;
}
function closeEdit(){editModal.style.display="none";}
function saveEdit(){
 current.Chinese=editChinese.value;
 current.Pinyin=editPinyin.value;
 current.Meaning=editMeaning.value;
 editedWords.push({...current});
 updateWordDisplay();
 closeEdit();
}

function exportEditedWords(){
 if(!editedWords.length) return alert("Chưa có từ sửa.");
 const text=editedWords.map(w=>`${w.Chinese} (${w.Pinyin}) - ${w.Meaning}`).join("\n");
 const blob=new Blob([text],{type:"text/plain"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="tu_da_sua.txt";
 a.click();
}

/* ==== STATS ==== */

function updateStats(){
 total.textContent="Tổng: "+stats.total;
 correct.textContent="Đúng: "+stats.correct;
 wrong.textContent="Sai: "+stats.wrong;
 let acc=Math.round(stats.correct/stats.total*100)||0;
 accuracy.textContent="Độ chính xác: "+acc+"%";
}

function saveStats(){
 localStorage.setItem("vocabStats",JSON.stringify(stats));
}
function loadStats(){
 let s=localStorage.getItem("vocabStats");
 if(s) stats=JSON.parse(s);
 updateStats();
}

function resetStats(){
 localStorage.removeItem("vocabStats");
 stats={total:0,correct:0,wrong:0,wrongWords:[]};
 updateStats();
}

function exportWrongWords(){
 if(!stats.wrongWords.length) return alert("Không có từ sai.");
 const text=stats.wrongWords.map(w=>`${w.Chinese} (${w.Pinyin}) - ${w.Meaning}`).join("\n");
 const blob=new Blob([text],{type:"text/plain"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="tu_sai.txt";
 a.click();
}

function toggleLearningMode(){
 retryMode=!retryMode;
 nextWord();
}

/* ==== DARK ==== */
darkToggle.addEventListener("change",()=>{
 document.body.classList.toggle("dark-mode",darkToggle.checked);
 localStorage.setItem("dark",darkToggle.checked);
});
if(localStorage.getItem("dark")==="true"){
 darkToggle.checked=true;
 document.body.classList.add("dark-mode");
}

mode.onchange=updateWordDisplay;
showPinyin.onchange=updateWordDisplay;

answer.addEventListener("keyup",e=>{
 if(e.key==="Enter") checkAnswer();
});
</script>

</body>
</html>
