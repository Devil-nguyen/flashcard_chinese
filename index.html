<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcard tiếng Trung</title>

<style>
body{
 font-family:Arial;
 padding:20px;
 max-width:600px;
 margin:auto;
 background:#fff;
}
input,select,button{
 font-size:16px;
 margin-top:5px;
}
button{margin-right:5px;}

.correct{background:#d4edda;padding:10px;}
.wrong{background:#f8d7da;padding:10px;}

.dark-mode{
 background:#1e1e1e;
 color:#eee;
}
.dark-mode input,.dark-mode select,.dark-mode button{
 background:#333;
 color:#eee;
 border:1px solid #555;
}
</style>
</head>

<body>

<h2>Flashcard tiếng Trung</h2>

<select id="mode">
<option value="cn_to_vi">Tiếng Trung → Nghĩa</option>
<option value="vi_to_cn">Nghĩa → Tiếng Trung</option>
</select>

<label>
<input type="checkbox" id="showPinyin" checked> Hiện Pinyin
</label>

<label>
<input type="checkbox" id="darkToggle"> 🌙
</label>

<div id="word" style="font-size:26px;margin:15px 0"></div>

<input id="answer" placeholder="Nhập câu trả lời..." style="width:100%">

<br>

<button onclick="checkAnswer()">Kiểm tra</button>
<button onclick="nextWord()">Tiếp</button>
<button onclick="toggleWrongMode()">Học từ sai</button>

<div id="result"></div>

<hr>

<h3>Thống kê</h3>
<p id="total"></p>
<p id="correct"></p>
<p id="wrong"></p>
<p id="accuracy"></p>

<h4>Từ sai</h4>
<ul id="wrongList"></ul>

<script>
let vocabList=[];
let current=null;
let wrongMode=false;

let stats={
 total:0,
 correct:0,
 wrong:0,
 wrongWords:[]
};

fetch("tuvung.json")
.then(r=>r.json())
.then(data=>{
 vocabList=data;
 loadStats();
 nextWord();
});

function normalize(s){
 return s.trim().toLowerCase();
}

function nextWord(){
 document.getElementById("answer").value="";
 document.getElementById("result").innerHTML="";

 if(wrongMode && stats.wrongWords.length>0){
   current=stats.wrongWords[Math.floor(Math.random()*stats.wrongWords.length)];
 }else{
   current=vocabList[Math.floor(Math.random()*vocabList.length)];
 }
 showWord();
}

function showWord(){
 let text="";
 if(mode.value==="cn_to_vi"){
   text=current.Chinese;
   if(showPinyin.checked){
     text+=` (${current.Pinyin})`;
   }
 }else{
   text=current.Meaning;
 }
 document.getElementById("word").innerText=text;
}

function checkAnswer(){
 let input=normalize(answer.value);

 let correctText=
 mode.value==="cn_to_vi"
 ? current.Meaning
 : current.Chinese;

 let answers=correctText.split(/[,;]+/).map(normalize);

 stats.total++;

 if(answers.includes(input)){
   stats.correct++;
   result.className="correct";
   result.innerText="✅ Chính xác";

   stats.wrongWords=
   stats.wrongWords.filter(w=>w.Chinese!==current.Chinese);

   setTimeout(nextWord,800);
 }else{
   stats.wrong++;
   result.className="wrong";
   result.innerHTML=
   `❌ Sai<br>${current.Chinese} (${current.Pinyin}) - ${current.Meaning}`;

   if(!stats.wrongWords.some(w=>w.Chinese===current.Chinese)){
     stats.wrongWords.push(current);
   }
 }

 updateStats();
 saveStats();
}

function updateStats(){
 total.innerText="Tổng: "+stats.total;
 correct.innerText="Đúng: "+stats.correct;
 wrong.innerText="Sai: "+stats.wrong;

 let acc=stats.total?Math.round(stats.correct/stats.total*100):0;
 accuracy.innerText="Tỉ lệ đúng: "+acc+"%";

 wrongList.innerHTML="";
 stats.wrongWords.forEach(w=>{
   let li=document.createElement("li");
   li.innerText=`${w.Chinese} (${w.Pinyin}) - ${w.Meaning}`;
   wrongList.appendChild(li);
 });
}

function toggleWrongMode(){
 wrongMode=!wrongMode;
 nextWord();
}

function saveStats(){
 localStorage.setItem("stats",JSON.stringify(stats));
}

function loadStats(){
 let s=localStorage.getItem("stats");
 if(s) stats=JSON.parse(s);
 updateStats();
}

answer.addEventListener("keyup",e=>{
 if(e.key==="Enter") checkAnswer();
});

darkToggle.addEventListener("change",()=>{
 document.body.classList.toggle("dark-mode",darkToggle.checked);
});

mode.onchange=showWord;
showPinyin.onchange=showWord;
</script>

</body>
</html>
