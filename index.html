<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Flashcard tiếng Trung</title>

<style>
body{
 font-family: Arial, sans-serif;
 text-align:center;
 background:#f5f5f5;
}

.container{
 max-width:700px;
 margin:auto;
 background:white;
 padding:20px;
 border-radius:10px;
}

h1{margin-bottom:10px;}

input{
 width:95%;
 padding:10px;
 font-size:18px;
}

button{
 padding:8px 12px;
 margin:5px;
 font-size:16px;
 cursor:pointer;
}

.correct{
 background:#d4edda;
 padding:10px;
 margin-top:10px;
}

.wrong{
 background:#f8d7da;
 padding:10px;
 margin-top:10px;
}

#question{
 font-size:26px;
 margin:15px 0;
}

ul{text-align:left;}
</style>
</head>

<body>

<div class="container">

<h1>Flashcard tiếng Trung</h1>

Chế độ:
<select id="mode">
 <option value="cn_to_vi">Tiếng Trung → Nghĩa</option>
 <option value="vi_to_cn">Nghĩa → Tiếng Trung</option>
</select>

<label>
 <input type="checkbox" id="showPinyin" checked>
 Hiện Pinyin
</label>

<div id="question"></div>

<input id="answer" placeholder="Nhập câu trả lời">

<br>

<button onclick="checkAnswer()">🔍 Kiểm tra</button>
<button onclick="nextWord()">➡ Tiếp</button>
<button onclick="startWrongMode()">📚 Học từ sai</button>
<button onclick="resetStats()">♻ Reset</button>

<div id="result"></div>

<hr>

<h2>Thống kê</h2>
Tổng: <span id="total">0</span> |
Đúng: <span id="correct">0</span> |
Sai: <span id="wrong">0</span> |
Tỉ lệ đúng: <span id="percent">0%</span>

<h3>Từ sai</h3>
<ul id="wrongList"></ul>

</div>

<script>
let vocab=[
 {Chinese:"你好",Pinyin:"nǐ hǎo",Meaning:"xin chào"},
 {Chinese:"谢谢",Pinyin:"xièxiè",Meaning:"cảm ơn"},
 {Chinese:"再见",Pinyin:"zàijiàn",Meaning:"tạm biệt"},
 {Chinese:"高兴",Pinyin:"gāoxìng",Meaning:"vui vẻ"},
 {Chinese:"学习",Pinyin:"xuéxí",Meaning:"học tập"},
 {Chinese:"老师",Pinyin:"lǎoshī",Meaning:"giáo viên"}
];

let stats={
 total:0,
 correct:0,
 wrong:0,
 wrongWords:[]
};

let current=null;
let wrongMode=false;

function normalize(s){
 return s.trim().toLowerCase();
}

function save(){
 localStorage.setItem("flashStats",JSON.stringify(stats));
}

function load(){
 let s=localStorage.getItem("flashStats");
 if(s) stats=JSON.parse(s);
}

function randomWord(){
 if(wrongMode && stats.wrongWords.length>0){
   return stats.wrongWords[Math.floor(Math.random()*stats.wrongWords.length)];
 }
 return vocab[Math.floor(Math.random()*vocab.length)];
}

function showWord(){
 let q="";
 if(mode.value==="cn_to_vi"){
   q=current.Chinese;
   if(showPinyin.checked) q+=` (${current.Pinyin})`;
 }else{
   q=current.Meaning;
 }
 document.getElementById("question").innerText=q;
}

function nextWord(){
 current=randomWord();
 showWord();
 answer.value="";
 result.innerHTML="";
}

function checkAnswer(){
 let input=normalize(answer.value);

 let correctAnswer = mode.value==="cn_to_vi"
 ? current.Meaning
 : current.Chinese;

 let list=correctAnswer.split(/[,;]+/).map(normalize);

 stats.total++;

 if(list.includes(input)){
   stats.correct++;
   result.className="correct";
   result.innerText="✅ Chính xác!";

   stats.wrongWords=
   stats.wrongWords.filter(w=>w.Chinese!==current.Chinese);

   setTimeout(nextWord,800);
 }else{
   stats.wrong++;
   result.className="wrong";
   result.innerHTML=
   `❌ Sai<br>${current.Chinese} (${current.Pinyin}) - ${current.Meaning}`;

   if(!stats.wrongWords.some(w=>w.Chinese===current.Chinese)){
     stats.wrongWords.push(current);
   }
 }

 updateStats();
 save();
}

function updateStats(){
 total.innerText=stats.total;
 correct.innerText=stats.correct;
 wrong.innerText=stats.wrong;

 let p=stats.total?Math.round(stats.correct/stats.total*100):0;
 percent.innerText=p+"%";

 wrongList.innerHTML="";
 stats.wrongWords.forEach(w=>{
   let li=document.createElement("li");
   li.innerText=
   `${w.Chinese} (${w.Pinyin}) - ${w.Meaning}`;
   wrongList.appendChild(li);
 });
}

function startWrongMode(){
 wrongMode=true;
 nextWord();
}

function resetStats(){
 if(confirm("Reset thống kê?")){
   stats={
    total:0,
    correct:0,
    wrong:0,
    wrongWords:[]
   };
   save();
   updateStats();
 }
}

load();
updateStats();
nextWord();
</script>

</body>
</html>
